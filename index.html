    <!-- Preconnect: instaura in anticipo DNS/TLS verso i domini dei font,
         così i <link rel="stylesheet"> sotto (bloccanti il rendering, servono
         a evitare che le icone Material Symbols compaiano come testo grezzo
         prima che il font carichi) partono più velocemente invece di aprire
         la connessione da zero al momento della richiesta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

        "applicationCategory": "Productivity",
        "operatingSystem": "Any",
        "inLanguage": "it"
      }
    </script>
  </head>
